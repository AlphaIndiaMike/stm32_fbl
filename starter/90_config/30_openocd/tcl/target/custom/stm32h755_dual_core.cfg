# ------------------------------------------------------------------------------
# stm32h7x_dual_core.cfg
# ------------------------------------------------------------------------------

# If these aren’t already set, define them so we can reference them.
# The official stm32h7x.cfg often sets _CHIPNAME to "stm32h7x" or something similar.
if {![info exists _CHIPNAME]} {
    set _CHIPNAME stm32h7x
}
if {![info exists _DAPNAME]} {
    # Often _DAPNAME is just "<chipname>.dap"
    set _DAPNAME "$_CHIPNAME.dap"
}

set DUAL_CORE 1
set DUAL_BANK 1
# Load the official single-core script, which might define base config & TAP.
source [find target/stm32h7x.cfg]

# Optionally specify reset configuration if needed:
reset_config none separate
# This will reset at attach - not recommended 
# reset_config connect_assert_srst

# Configure GDB ports
stm32h7x.cpu0 configure -gdb-port 50000
stm32h7x.cpu1 configure -gdb-port 50008